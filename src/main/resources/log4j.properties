################################################################
# 1) Root logger at FATAL → only fatal errors go to console+file
################################################################
log4j.rootLogger=INFO, A1, file

#################################
# 2) Console appender (A1)
#################################
log4j.appender.A1=org.apache.log4j.ConsoleAppender
log4j.appender.A1.Target=System.out
log4j.appender.A1.layout=org.apache.log4j.PatternLayout
log4j.appender.A1.layout.ConversionPattern=%-4r [%t] %-5p %c %x - %m%n

#################################
# 3) Rolling file appender
#################################
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=dclogging.log
log4j.appender.file.MaxFileSize=10MB
log4j.appender.file.MaxBackupIndex=1
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

##############################################################
# 4) Turn on DEBUG just for Spring’s bean package (console only)
##############################################################
log4j.logger.org.springframework.beans=INFO, A1

##########################################
# 5) Keep Hibernate SQL logging verbose  #
##########################################
log4j.logger.org.hibernate.SQL=info
log4j.logger.org.hibernate.type.descriptor.sql.BasicBinder=info
log4j.logger.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping = DEBUG
log4j.logger.org.greenbuttonalliance.espi.thirdparty.web.AuthorizationController=DEBUG


# for Log4J
log4j.logger.org.apache.http.wire=DEBUG
log4j.logger.org.apache.http.impl.conn=DEBUG
